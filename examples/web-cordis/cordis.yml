# 用于检查自引用 Cordis 工具的可选 Web 组合。
# 临时插件代码可访问所有已注入的实时能力；应按 shell 访问对待本部署，不能视为安全边界。
# 本文件是 Web profile（dsh-base + dsh-gui-app + dsh-web-app）之上的 patch
# overlay，而不是配置树：`dsh web --patch` 会在同一 include 层级把它作为另一份
# 同级 patch 列表应用，因此这些 patch 可以命中任意组合包行。patch 会替换目标行的
# 整个 `config`。

# Pinning the port here keeps this demo off the default 3080.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3081

- insert:
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'
