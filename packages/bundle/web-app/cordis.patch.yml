# dsh-web-app：叠加在 dsh-gui-app 之后的浏览器传输层。
# Web 启动参数先提供 webStartup，绑定后再提供 webRuntime。

- insert:
    # Web 目录选择器根据绑定地址与启动环境选择实现。
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080

    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    - id: modules-web
      name: '@deepseek-ai/dsh-client-modules/web'
      inject: [clientModules]

    - id: connection-web
      name: '@deepseek-ai/dsh-client-connection/web'
      inject: [webRuntime, connection]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # 浏览器保存 provider 只在 Web 产品中挂载；共享导出 UI 只依赖 SessionLogSaver。
    - id: session-log-saver-web
      name: '@deepseek-ai/dsh-session-log-saver-web'
